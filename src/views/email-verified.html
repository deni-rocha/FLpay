<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>E-mail verificado</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #f6f6f6;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 400px;
      margin: 80px auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 32px 24px;
      text-align: center;
    }
    .icon {
      font-size: 48px;
      color: #28a745;
      margin-bottom: 16px;
    }
    h1 {
      color: #003566;
      margin-bottom: 12px;
    }
    p {
      color: #333;
      font-size: 16px;
      margin-bottom: 0;
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 24px;
      background: #003566;
      color: #fff;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #001d3d;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" style="color: #FFD700;">✔️</div>
    <h1>E-mail verificado!</h1>
    <p>Seu e-mail foi confirmado com sucesso.<br>Agora você pode acessar sua conta.</p>
    <a href="realcestore://" class="btn">abrir o aplicativo</a>
  </div>
</body>
</html>
